name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drawing-tool/package-lock.json

      - run: npm run setup
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: screshot-extension
          path: build/*.zip
