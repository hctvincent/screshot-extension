<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/ico" href="./favicon.ico"/>
<title>Full page screenshot – Screshot</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5e7eb; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; }
  header {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #d1d5db;
  }
  header img { width: 24px; height: 24px; }
  #info { color: #6b7280; margin-right: auto; }
  button {
    font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid #d1d5db; background: #fff; color: #111827;
  }
  button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 24px 16px; display: flex; justify-content: center; }
  #shot { display: none; max-width: 100%; height: auto; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.15); }
  #status { padding: 48px 16px; text-align: center; color: #6b7280; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 8px; background: #111827; color: #fff;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
</style>
</head>
<body>
  <header>
    <img src="icon32.png" alt="">
    <strong>Full page screenshot</strong>
    <span id="info"></span>
    <button id="copy" disabled>Copy</button>
    <button id="download" disabled>Download PNG</button>
    <button id="share" class="primary" disabled>Share</button>
  </header>
  <div id="status">Loading screenshot…</div>
  <main><img id="shot" alt="Full page screenshot"></main>
  <div id="toast"></div>
  <script src="share/share-panel.js"></script>
  <script src="fullpage.js"></script>
</body>
</html>
