<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/ico" href="./favicon.ico"/>
<title>Full page screenshot – Screshot</title>
<!-- Shared Fluent UI (also used by the editor and the Share panel). -->
<link rel="stylesheet" href="ui/fluent.css" data-sf-styles>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sf-bg3); font: 14px/20px var(--sf-font); color: var(--sf-fg1); }
  /* Command bar */
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    min-height: 48px; padding: 8px 16px; background: var(--sf-bg1);
    box-shadow: 0 0 2px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14);
  }
  header img { width: 20px; height: 20px; }
  header h1 { margin: 0; font: 600 14px/20px var(--sf-font); }
  #info { margin-right: auto; color: var(--sf-fg3); font-size: 12px; }
  #info::before { content: "·"; margin: 0 8px; color: var(--sf-fg-disabled); }
  #info:empty::before { content: none; }
  main { padding: 24px 16px 48px; display: flex; justify-content: center; }
  #shot { display: none; max-width: 100%; height: auto; background: #fff; border-radius: var(--sf-radius-m); box-shadow: var(--sf-shadow8); }
  #status { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 96px 16px; color: var(--sf-fg3); }
</style>
</head>
<body>
  <header>
    <img src="icon32.png" alt="">
    <h1>Full page screenshot</h1>
    <span id="info"></span>
    <button id="copy" class="sf-btn" disabled>Copy</button>
    <button id="download" class="sf-btn" disabled>Download PNG</button>
    <button id="share" class="sf-btn primary" disabled>Share</button>
  </header>
  <div id="status" role="status"><span class="sf-spinner large"></span>Loading screenshot…</div>
  <main><img id="shot" alt="Full page screenshot"></main>
  <script src="ui/ui.js"></script>
  <script src="share/e2ee.js"></script>
  <script src="share/share-panel.js"></script>
  <script src="fullpage.js"></script>
</body>
</html>
