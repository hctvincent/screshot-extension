<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --brand:#012fff; --deep:#0016a8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:440px; height:280px; overflow:hidden; background:var(--deep); }
  .tile {
    position:relative; width:440px; height:280px; overflow:hidden;
    font-family:'Inter',sans-serif; color:#fff;
    background:
      radial-gradient(circle at 18% 20%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(135deg, var(--brand) 0%, #0122d6 55%, var(--deep) 100%);
  }
  /* subtle grid */
  .tile::before { content:""; position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
    background-size:22px 22px; }

  .brand { position:absolute; left:26px; top:34px; width:190px; }
  .logo { width:56px; height:56px; filter:brightness(0) invert(1); display:block; }
  .name { margin-top:16px; font-weight:800; font-size:36px; letter-spacing:-1px; line-height:1; }
  .tag { margin-top:10px; font-weight:500; font-size:15px; line-height:1.35; color:rgba(255,255,255,.88); }
  .kbd { margin-top:18px; display:inline-flex; gap:4px; align-items:center; font-weight:600; font-size:11px; color:rgba(255,255,255,.9); }
  .kbd b { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:5px; padding:3px 6px; font-weight:600; }

  /* browser mock */
  .win { position:absolute; left:214px; top:46px; width:250px; height:196px; border-radius:10px; background:#fff;
    box-shadow:0 18px 40px rgba(0,8,80,.45); transform:rotate(-4deg); overflow:hidden; }
  .bar { height:20px; background:#eef1f6; display:flex; align-items:center; gap:4px; padding-left:8px; }
  .bar i { width:7px; height:7px; border-radius:50%; background:#cfd5e0; }
  .page { position:relative; padding:12px; }
  .line { height:7px; border-radius:4px; background:#e3e7ef; margin-bottom:7px; }
  .card { display:flex; gap:8px; margin-top:10px; }
  .card div { flex:1; height:62px; border-radius:6px; background:#f1f4fa; position:relative; }
  .bars { position:absolute; bottom:8px; left:8px; right:8px; display:flex; align-items:flex-end; gap:4px; height:40px; }
  .bars span { flex:1; background:#b9c4ff; border-radius:2px; }
  .sel { position:absolute; left:18px; top:44px; width:150px; height:104px; border:2px dashed #012fff;
    box-shadow:0 0 0 999px rgba(10,20,60,.45); background:transparent; }
  .hl { position:absolute; left:28px; top:52px; width:96px; height:10px; background:rgba(255,214,0,.7); border-radius:3px; }
  .arrow { position:absolute; left:150px; top:120px; }

  .toolbar { position:absolute; left:226px; top:20px; display:flex; gap:3px; padding:4px; background:#fff; border-radius:8px;
    box-shadow:0 8px 20px rgba(0,8,80,.35); transform:rotate(-4deg); color:#2a2f3a; }
  .toolbar span { width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:5px; background:#f0f2f6; }
  .toolbar span.on { color:#ff2b2b; background:#e4e7ee; }
</style></head>
